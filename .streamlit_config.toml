[theme]
primaryColor = "#FF6B6B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "minimal"

[logger]
level = "info"

[server]
maxUploadSize = 200
enableXsrfProtection = true
headless = true
port = 8501

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[ui]
hideTopBar = false
hideFooter = false
hideSidebarNav = false
